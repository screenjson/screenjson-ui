<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScreenJSON UI — CDN demo</title>
    <link rel="stylesheet" href="/dist/screenjson-ui.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #cfcdc6; }
      #viewer    { height: 100vh; }
    </style>
  </head>
  <body>
    <div id="viewer"></div>

    <script type="module">
      import ScreenJSONUI from '/dist/screenjson-ui.js';

      // Load a bundled example, then mount.
      const res = await fetch('/examples/his-girl-friday.json');
      const doc = await res.json();

      new ScreenJSONUI({
        element: 'viewer',
        document: doc,
        theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      });
    </script>
  </body>
</html>
